name: Temporary artifact quota probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-artifact-quota-probe.yml'

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create tiny probe
        run: echo 'artifact quota probe' > quota-probe.txt

      - name: Upload tiny probe
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: temporary-quota-probe
          path: quota-probe.txt
          retention-days: 1

      - name: Delete probe immediately
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: Number('${{ steps.upload.outputs.artifact-id }}'),
            });
