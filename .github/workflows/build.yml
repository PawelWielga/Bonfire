name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 24 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            24

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          bash ./gradlew build -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 2>&1 | tee build.log

      - name: Upload test plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bonfire-squaremap-test-${{ github.run_number }}
          path: build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 14
