name: Temporary artifact cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-artifact-cleanup.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions artifacts
        uses: actions/github-script@v8
        with:
          script: |
            let deleted = 0;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page: 1,
              });

              if (data.artifacts.length === 0) {
                break;
              }

              for (const artifact of data.artifacts) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                core.info(`Deleted artifact ${artifact.name} (${artifact.id})`);
                deleted += 1;
              }
            }

            core.notice(`Deleted ${deleted} Actions artifacts.`);
